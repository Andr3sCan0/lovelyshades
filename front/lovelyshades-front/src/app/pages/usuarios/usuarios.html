<div class="usuarios-container">
  <div class="header">
    <h1>Gestión de Usuarios</h1>
    <button (click)="abrirFormulario()" class="btn btn-primary">Crear Usuario</button>
  </div>

  <div *ngIf="mostrarFormulario" class="formulario">
    <h2>{{ editando ? 'Editar Usuario' : 'Crear Usuario' }}</h2>
    <form>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input 
          type="text" 
          [(ngModel)]="usuarioActual.nombreUsuario"
          name="nombreUsuario"
          class="form-control">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="usuarioActual.email"
          name="email"
          class="form-control">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="usuarioActual.contrasenaHash"
          name="contrasenaHash"
          class="form-control"
          *ngIf="!editando">
      </div>

      <div class="form-group">
        <label>Rol</label>
        <select 
          [(ngModel)]="usuarioActual.rol"
          name="rol"
          class="form-control">
          <option [value]="{}" disabled>Seleccione un rol</option>
          <option *ngFor="let rol of roles" [value]="rol">{{ rol.nombreRol }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>
          <input 
            type="checkbox" 
            [(ngModel)]="usuarioActual.estado"
            name="estado">
          Activo
        </label>
      </div>

      <div class="form-actions">
        <button (click)="guardar()" class="btn btn-success">Guardar</button>
        <button (click)="cancelar()" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="tabla-container">
    <table class="tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre de Usuario</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.idUsuario }}</td>
          <td>{{ usuario.nombreUsuario }}</td>
          <td>{{ usuario.email }}</td>
          <td>{{ usuario.rol?.nombreRol }}</td>
          <td>{{ usuario.estado ? 'Activo' : 'Inactivo' }}</td>
          <td>
            <button (click)="editar(usuario)" class="btn btn-sm btn-info">Editar</button>
            <button (click)="eliminar(usuario.idUsuario)" class="btn btn-sm btn-danger">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
